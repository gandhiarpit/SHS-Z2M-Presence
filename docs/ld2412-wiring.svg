<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600">
  <rect x="0" y="0" width="980" height="600" fill="#ffffff"/>

  <!-- ===================== LD2412 ===================== -->
  <rect x="55" y="185" width="250" height="140" rx="8" fill="#1e3f73" stroke="#0e2244" stroke-width="2"/>
  <g fill="#d9c07a" opacity="0.85">
    <rect x="95" y="205" width="34" height="34" rx="3"/>
    <rect x="137" y="205" width="34" height="34" rx="3"/>
    <rect x="95" y="271" width="34" height="34" rx="3"/>
    <rect x="137" y="271" width="34" height="34" rx="3"/>
  </g>
  <rect x="196" y="232" width="44" height="44" rx="4" fill="#15151a"/>
  <text x="180" y="348" font-family="Verdana, DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#1b1b1b" text-anchor="middle">LD2412</text>
  <text x="180" y="368" font-family="Verdana, DejaVu Sans, sans-serif" font-size="12" fill="#555" text-anchor="middle">28.0 mm long</text>

  <!-- left edge pads: OUT, GND, +5V -->
  <circle cx="55" cy="212" r="7" fill="#c9b27a" stroke="#6b5a2c" stroke-width="1"/>
  <text x="40" y="217" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1b1b1b" text-anchor="end">OUT</text>
  <circle cx="55" cy="255" r="7" fill="#c9b27a" stroke="#6b5a2c" stroke-width="1"/>
  <text x="40" y="260" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1b1b1b" text-anchor="end">GND</text>
  <circle cx="55" cy="298" r="7" fill="#c9b27a" stroke="#6b5a2c" stroke-width="1"/>
  <text x="40" y="303" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1b1b1b" text-anchor="end">+5V</text>

  <!-- right edge pads: TX, RX, GND, 3V3 -->
  <circle cx="305" cy="200" r="7" fill="#c9b27a" stroke="#6b5a2c" stroke-width="1"/>
  <text x="320" y="205" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1b1b1b">TX</text>
  <circle cx="305" cy="237" r="7" fill="#c9b27a" stroke="#6b5a2c" stroke-width="1"/>
  <text x="320" y="242" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1b1b1b">RX</text>
  <circle cx="305" cy="274" r="7" fill="#c9b27a" stroke="#6b5a2c" stroke-width="1"/>
  <text x="320" y="279" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1b1b1b">GND</text>
  <circle cx="305" cy="311" r="7" fill="#c9b27a" stroke="#6b5a2c" stroke-width="1"/>
  <text x="320" y="316" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1b1b1b">3V3</text>

  <!-- ===================== ESP32-C6 ===================== -->
  <rect x="430" y="95" width="130" height="410" rx="10" fill="#22252b" stroke="#0e1014" stroke-width="2"/>
  <rect x="452" y="120" width="86" height="120" rx="4" fill="#3a3f47"/>
  <text x="495" y="186" font-family="Verdana, DejaVu Sans, sans-serif" font-size="12" fill="#cfd4dc" text-anchor="middle">C6-WROOM</text>
  <text x="495" y="82" font-family="Verdana, DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#1b1b1b" text-anchor="middle">ESP32-C6</text>

  <circle cx="430" cy="200" r="6" fill="#d8d8d8" stroke="#555" stroke-width="1"/>
  <text x="444" y="204" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#e8e8e8">4</text>
  <circle cx="430" cy="237" r="6" fill="#d8d8d8" stroke="#555" stroke-width="1"/>
  <text x="444" y="241" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#e8e8e8">5</text>
  <circle cx="430" cy="274" r="6" fill="#d8d8d8" stroke="#555" stroke-width="1"/>
  <text x="444" y="278" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#e8e8e8">G</text>
  <circle cx="430" cy="430" r="6" fill="#d8d8d8" stroke="#555" stroke-width="1"/>
  <text x="444" y="434" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#e8e8e8">5V</text>

  <circle cx="560" cy="200" r="6" fill="#d8d8d8" stroke="#555" stroke-width="1"/>
  <text x="546" y="204" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#e8e8e8" text-anchor="end">19</text>
  <circle cx="560" cy="237" r="6" fill="#d8d8d8" stroke="#555" stroke-width="1"/>
  <text x="546" y="241" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#e8e8e8" text-anchor="end">18</text>
  <circle cx="560" cy="274" r="6" fill="#d8d8d8" stroke="#555" stroke-width="1"/>
  <text x="546" y="278" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#e8e8e8" text-anchor="end">G</text>
  <circle cx="560" cy="430" r="6" fill="#d8d8d8" stroke="#555" stroke-width="1"/>
  <text x="546" y="434" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#e8e8e8" text-anchor="end">5V</text>

  <!-- ===================== LD2450 ===================== -->
  <rect x="685" y="185" width="240" height="140" rx="8" fill="#12564f" stroke="#093831" stroke-width="2"/>
  <g fill="#d9c07a" opacity="0.85">
    <rect x="722" y="215" width="30" height="30" rx="3"/>
    <rect x="764" y="215" width="30" height="30" rx="3"/>
    <rect x="806" y="215" width="30" height="30" rx="3"/>
    <rect x="848" y="215" width="30" height="30" rx="3"/>
  </g>
  <text x="805" y="348" font-family="Verdana, DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#1b1b1b" text-anchor="middle">LD2450</text>

  <circle cx="685" cy="200" r="7" fill="#c9b27a" stroke="#6b5a2c" stroke-width="1"/>
  <text x="670" y="205" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1b1b1b" text-anchor="end">TX</text>
  <circle cx="685" cy="237" r="7" fill="#c9b27a" stroke="#6b5a2c" stroke-width="1"/>
  <text x="670" y="242" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1b1b1b" text-anchor="end">RX</text>
  <circle cx="685" cy="274" r="7" fill="#c9b27a" stroke="#6b5a2c" stroke-width="1"/>
  <text x="670" y="279" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1b1b1b" text-anchor="end">GND</text>
  <circle cx="685" cy="311" r="7" fill="#c9b27a" stroke="#6b5a2c" stroke-width="1"/>
  <text x="670" y="316" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1b1b1b" text-anchor="end">5V</text>

  <!-- ===================== wires ===================== -->
  <path d="M305 200 H430" fill="none" stroke="#2e9e3f" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M305 237 H430" fill="none" stroke="#d13fb8" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M305 274 H430" fill="none" stroke="#1b1b1b" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M55 298 H26 V470 H430 V430" fill="none" stroke="#d92b2b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M685 200 H560" fill="none" stroke="#2e9e3f" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M685 237 H560" fill="none" stroke="#d13fb8" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M685 274 H560" fill="none" stroke="#1b1b1b" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M685 311 H654 V470 H560 V430" fill="none" stroke="#d92b2b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M55 212 H22" fill="none" stroke="#999999" stroke-width="3.2" stroke-dasharray="6 6" stroke-linecap="round"/>
  <text x="20" y="199" font-family="Verdana, DejaVu Sans, sans-serif" font-size="12" fill="#666">not used</text>

  <!-- ===================== notes ===================== -->
  <text x="30" y="522" font-family="Verdana, DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#1b1b1b">Connections</text>
  <text x="30" y="545" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1b1b1b">LD2412  TX-&gt;GPIO4   RX-&gt;GPIO5   GND-&gt;G   +5V-&gt;5V   OUT unconnected</text>
  <text x="30" y="564" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="13" fill="#1b1b1b">LD2450  TX-&gt;GPIO19  RX-&gt;GPIO18  GND-&gt;G   5V-&gt;5V</text>
  <text x="30" y="587" font-family="Verdana, DejaVu Sans, sans-serif" font-size="12.5" fill="#8a4b00">LD2412 runs at 115200 baud. Power from +5V OR 3V3, never both. Its power and UART pads sit on opposite edges.</text>

  <text x="950" y="545" font-family="Verdana, DejaVu Sans, sans-serif" font-size="12" fill="#666" text-anchor="end">Pad order from Figure 6 of the Hi-Link LD2412 manual.</text>
  <text x="950" y="564" font-family="Verdana, DejaVu Sans, sans-serif" font-size="12" fill="#666" text-anchor="end">Schematic, not to scale. Check against your module's silkscreen.</text>
</svg>
