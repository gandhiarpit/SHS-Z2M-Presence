name: Build firmware

# Builds the ESP32-C6 firmware and produces a single-file flash image
# (bootloader + partition table + app), the same packaging as the
# SHS_Z2M_Presence_<version>_merged.bin asset on the upstream releases.
#
# - every push / PR / manual run -> merged bin as a downloadable artifact
# - pushing a v* tag            -> merged bin attached to the GitHub release,
#                                  and its OTA entry merged into main's ota/index.json

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # release upload, and pushing the OTA index to main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ESP-IDF version is pinned to the one the committed sdkconfig was
      # generated with (see the header line of sdkconfig).
      - name: Build and merge
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32c6
          # make_release.py leaves otadata out of the merged bin: merge_bin pads gaps
          # with 0xFF, so including it would wipe zb_storage and unpair the device.
          # Tag builds also write this build's OTA entry, published to main below.
          command: idf.py build && python tools/make_release.py ${{ github.ref_type != 'tag' && '--no-index' || '' }}

      - name: Name the artifacts
        id: name
        run: |
          set -euo pipefail
          # Firmware version comes from the string the device reports over Zigbee,
          # so the file name always matches SHS_BASIC_SW_BUILD_ID.
          # The version string carries a ZCL length-prefix byte in its own
          # literal, so match the vN.N.N token rather than the first quoted one.
          VER="$(grep -oP 'SHS_BASIC_SW_BUILD_ID.*"\Kv[0-9][^"]*' main/shs01.h)"
          # The OTA index URL is built from the firmware version, so a tag that
          # doesn't match it would publish a link to a release holding other firmware.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${VER}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match firmware version ${VER} - bump SHS_BASIC_SW_BUILD_ID in main/shs01.h first"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="SHS_Z2M_Presence_${GITHUB_REF_NAME}_merged.bin"
          else
            NAME="SHS_Z2M_Presence_${VER}_${GITHUB_SHA::7}_merged.bin"
          fi
          mkdir -p dist
          cp build/release/*_merged.bin "dist/${NAME}"
          cp build/release/*.ota dist/
          cp build/bootloader/bootloader.bin dist/
          cp build/partition_table/partition-table.bin dist/
          cp build/SHS_Z2M_Presence.bin dist/
          cp zigbee2mqtt/external_converters/shs01_enhanced.js dist/
          cp zigbee2mqtt/external_converters/shs01_enhanced.mjs dist/
          echo "merged=${NAME}" >> "$GITHUB_OUTPUT"
          ls -l dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.merged }}
          path: dist/
          if-no-files-found: error

      - name: Attach to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `gh release upload` fails if no release exists for the tag yet, so
        # create it on first use and only upload into an existing one.
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
          fi

      # Zigbee2MQTT reads one OTA index: main's ota/index.json, shared by the
      # LD2410 and LD2412 builds. Replace only the entry with this build's
      # manufacturer + image type, so neither build removes the other's. Tags on
      # both branches can build at once, so a rejected push re-reads main and
      # retries. Pushes made with GITHUB_TOKEN don't start another workflow run.
      - name: Publish OTA index entry to main
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          # make_release.py appends this build's entry last
          export ENTRY="$(node -p 'JSON.stringify(require("./ota/index.json").slice(-1)[0])')"
          node -p 'const e = JSON.parse(process.env.ENTRY); `${e.fileName} type 0x${e.imageType.toString(16)}`'
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            rm -rf /tmp/main && git worktree prune
            git fetch --depth=1 origin main
            git worktree add --detach /tmp/main FETCH_HEAD
            node -e '
              const fs = require("fs"), p = process.argv[1], e = JSON.parse(process.env.ENTRY);
              const kept = JSON.parse(fs.readFileSync(p, "utf8"))
                .filter(x => !(x.imageType === e.imageType && x.manufacturerCode === e.manufacturerCode));
              fs.writeFileSync(p, JSON.stringify(kept.concat([e]), null, 2) + "\n");
            ' /tmp/main/ota/index.json
            if git -C /tmp/main diff --quiet -- ota/index.json; then
              echo "OTA index already up to date"; exit 0
            fi
            git -C /tmp/main commit -q -m "OTA index: ${GITHUB_REF_NAME}" -- ota/index.json
            if git -C /tmp/main push origin HEAD:main; then exit 0; fi
            echo "Push rejected (attempt ${attempt}), retrying"
            sleep $((attempt * 5))
          done
          echo "::error::Could not update the OTA index on main"; exit 1
